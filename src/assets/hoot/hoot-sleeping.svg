<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Hoot sleeping">
  <!-- Ear tufts — slightly drooped -->
  <ellipse cx="38" cy="22" rx="6" ry="10" fill="#FF6B00" opacity="0.7" transform="rotate(-5 38 22)"/>
  <ellipse cx="82" cy="22" rx="6" ry="10" fill="#FF6B00" opacity="0.7" transform="rotate(5 82 22)"/>
  <ellipse cx="38" cy="22" rx="3.5" ry="6.5" fill="#FFE8D6" opacity="0.7" transform="rotate(-5 38 22)"/>
  <ellipse cx="82" cy="22" rx="3.5" ry="6.5" fill="#FFE8D6" opacity="0.7" transform="rotate(5 82 22)"/>

  <!-- Head -->
  <circle cx="60" cy="60" r="38" fill="#FF6B00" opacity="0.8"/>
  <circle cx="60" cy="60" r="34" fill="#FFF7F0"/>

  <!-- Eyes closed — curved lines -->
  <circle cx="45" cy="56" r="12" fill="white" stroke="#FF6B00" stroke-width="2" opacity="0.9"/>
  <circle cx="75" cy="56" r="12" fill="white" stroke="#FF6B00" stroke-width="2" opacity="0.9"/>
  <!-- Glasses bridge -->
  <line x1="57" y1="56" x2="63" y2="56" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>

  <!-- Closed eye lines (sleepy curve) -->
  <path d="M37 56 Q45 62 53 56" stroke="#1A1208" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M67 56 Q75 62 83 56" stroke="#1A1208" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Small mouth / relaxed -->
  <path d="M54 70 Q60 74 66 70" stroke="#FF8A00" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Wings folded — resting -->
  <ellipse cx="28" cy="82" rx="10" ry="15" fill="#FF6B00" opacity="0.7"/>
  <ellipse cx="28" cy="82" rx="6" ry="10" fill="#FFE8D6" opacity="0.7"/>

  <ellipse cx="92" cy="82" rx="10" ry="15" fill="#FF6B00" opacity="0.7"/>
  <ellipse cx="92" cy="82" rx="6" ry="10" fill="#FFE8D6" opacity="0.7"/>

  <!-- Zzz text -->
  <text x="88" y="30" font-size="12" fill="#FF6B00" opacity="0.8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800">Z</text>
  <text x="97" y="20" font-size="10" fill="#FF6B00" opacity="0.6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800">z</text>
  <text x="104" y="12" font-size="8" fill="#FF6B00" opacity="0.4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800">z</text>

  <!-- Belly -->
  <ellipse cx="60" cy="80" rx="18" ry="12" fill="#FFE8D6" opacity="0.8"/>
</svg>
