<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" fill="none" role="img" aria-label="Hoot celebrating">
  <!-- Confetti dots -->
  <circle cx="20" cy="20" r="4" fill="#FF6B00" opacity="0.8"/>
  <circle cx="120" cy="15" r="3" fill="#FFE8D6" opacity="0.9"/>
  <circle cx="130" cy="40" r="5" fill="#FF8A00" opacity="0.7"/>
  <circle cx="10" cy="50" r="3" fill="#FFE8D6" opacity="0.8"/>
  <rect x="110" y="60" width="8" height="4" rx="2" fill="#FF6B00" opacity="0.7" transform="rotate(30 110 60)"/>
  <rect x="15" y="70" width="6" height="3" rx="1.5" fill="#FF8A00" opacity="0.8" transform="rotate(-20 15 70)"/>
  <circle cx="125" cy="80" r="4" fill="#FFE8D6" opacity="0.7"/>
  <rect x="5" y="30" width="7" height="3" rx="1.5" fill="#FF6B00" opacity="0.6" transform="rotate(45 5 30)"/>

  <!-- Ear tufts -->
  <ellipse cx="48" cy="25" rx="7" ry="12" fill="#FF6B00" transform="rotate(-15 48 25)"/>
  <ellipse cx="92" cy="25" rx="7" ry="12" fill="#FF6B00" transform="rotate(15 92 25)"/>
  <ellipse cx="48" cy="25" rx="4" ry="8" fill="#FFE8D6" transform="rotate(-15 48 25)"/>
  <ellipse cx="92" cy="25" rx="4" ry="8" fill="#FFE8D6" transform="rotate(15 92 25)"/>

  <!-- Party hat on head -->
  <polygon points="70,8 55,38 85,38" fill="#FF6B00"/>
  <polygon points="70,8 56,38 65,38" fill="#FF8A00" opacity="0.5"/>
  <circle cx="70" cy="8" r="4" fill="#FFE8D6"/>
  <line x1="55" y1="38" x2="85" y2="38" stroke="#FFE8D6" stroke-width="3"/>
  <!-- Hat polka dots -->
  <circle cx="66" cy="20" r="2" fill="white" opacity="0.8"/>
  <circle cx="74" cy="28" r="2" fill="white" opacity="0.8"/>

  <!-- Head -->
  <circle cx="70" cy="68" r="38" fill="#FF6B00"/>
  <circle cx="70" cy="68" r="34" fill="#FFF7F0"/>

  <!-- Eyes: big open happy -->
  <circle cx="55" cy="64" r="12" fill="white" stroke="#FF6B00" stroke-width="2"/>
  <circle cx="85" cy="64" r="12" fill="white" stroke="#FF6B00" stroke-width="2"/>
  <!-- Glasses bridge -->
  <line x1="67" y1="64" x2="73" y2="64" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>

  <circle cx="55" cy="64" r="6" fill="#1A1208"/>
  <circle cx="85" cy="64" r="6" fill="#1A1208"/>
  <circle cx="57" cy="62" r="2.5" fill="white"/>
  <circle cx="87" cy="62" r="2.5" fill="white"/>

  <!-- Big open smile -->
  <path d="M54 76 Q70 92 86 76" stroke="#FF6B00" stroke-width="2.5" fill="#FFE8D6" stroke-linecap="round"/>

  <!-- Beak -->
  <path d="M66 74 Q70 80 74 74" fill="#FF8A00" stroke="#FF6B00" stroke-width="1"/>

  <!-- Wings raised high — celebration! -->
  <ellipse cx="28" cy="58" rx="12" ry="22" fill="#FF6B00" transform="rotate(-45 28 58)"/>
  <ellipse cx="28" cy="58" rx="7" ry="14" fill="#FFE8D6" transform="rotate(-45 28 58)"/>

  <ellipse cx="112" cy="58" rx="12" ry="22" fill="#FF6B00" transform="rotate(45 112 58)"/>
  <ellipse cx="112" cy="58" rx="7" ry="14" fill="#FFE8D6" transform="rotate(45 112 58)"/>

  <!-- Belly -->
  <ellipse cx="70" cy="88" rx="18" ry="12" fill="#FFE8D6"/>
</svg>
