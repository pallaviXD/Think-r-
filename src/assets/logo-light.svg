<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" fill="none" role="img" aria-label="Thinkr logo">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with gradient background -->
  <rect x="0" y="4" width="40" height="40" rx="10" fill="url(#logo-grad)"/>

  <!-- Lightbulb shape (teardrop) -->
  <ellipse cx="20" cy="19" rx="8" ry="9" fill="white" opacity="0.95"/>
  <rect x="16" y="26" width="8" height="3" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="17" y="29" width="6" height="2" rx="1" fill="white" opacity="0.85"/>

  <!-- Filament forming a graduation cap spark (squiggle) -->
  <path d="M18 23 Q17 21 20 20 Q23 19 22 23" stroke="#FF6B00" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Graduation cap on top of bulb -->
  <rect x="15" y="11" width="10" height="2" rx="1" fill="white" opacity="0.9"/>
  <polygon points="20,9 15,13 25,13" fill="white" opacity="0.9"/>
  <line x1="25" y1="11" x2="27" y2="14" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Wordmark: Thinkr -->
  <text x="50" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#1A1208" letter-spacing="-0.5">Think</text>
  <text x="128" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#FF6B00">r</text>
</svg>
